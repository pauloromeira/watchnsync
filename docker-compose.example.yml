---
# References:
#   - https://github.com/pauloromeira/watchnsync
#   - https://rclone.org/
#   - https://linux.die.net/man/1/inotifywait

services:
  watchnsync:
    image: ghcr.io/pauloromeira/watchnsync:latest
    container_name: watchnsync
    environment:
      - RCLONE_ACTION=sync
      - RCLONE_REMOTE=myremote:backup
      - RCLONE_ARGS=--verbose --dry-run
      - DEBOUNCE_DELAY=60
    volumes:
      # Local folder to recursively monitor
      - /path/to/host/watch:/watch
      # Path to your host rclone configuration file (read-only recommended)
      - /path/to/host/rclone.conf:/config/rclone.conf:ro
    restart: unless-stopped
